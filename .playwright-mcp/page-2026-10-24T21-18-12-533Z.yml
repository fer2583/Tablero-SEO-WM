        - generic [ref=f1e111]:
          - generic [ref=f1e112]: Contacto
          - heading "Una conversación comercial sobre tu programa, no un recorrido de producto" [level=2] [ref=f1e114]
          - paragraph [ref=f1e116]: "Escribí acá si estás evaluando Whalemate para tu organización: alcance, padrón, integraciones y qué tiene que mostrar el programa cuando pregunten dirección o auditoría."
          - generic [ref=f1e117]:
            - generic [ref=f1e119]:
              - generic [aria-hidden] [ref=f1e122]: "01"
              - paragraph [ref=f1e123]: "Alcance y padrón: cuántas personas entran, en qué países, con qué idiomas y qué canales se simulan. El padrón cambia el diseño del programa y también el número, así que es la primera pregunta que vas a recibir. Si ya tenés un proveedor y estás comparando, decilo en el mensaje: la conversación arranca en lo que hoy te falta, no en una lista de features que ya viste en otro sitio."
            - generic [ref=f1e125]:
              - generic [aria-hidden] [ref=f1e133]: "02"
              - paragraph [ref=f1e134]: "Compras y seguridad: el Trust Center y el DPA están publicados para que tu equipo los revise antes de hablar con nosotros. ISO/IEC 27001:2022 está. SOC 2 no. Sin agente en el endpoint. Si tu pliego pide un sello que no tenemos, lo vas a saber en el primer intercambio y no tres reuniones después, cuando ya gastaste el trimestre."
            - generic [ref=f1e136]:
              - generic [aria-hidden] [ref=f1e139]: "03"
              - paragraph [ref=f1e140]: "Precio y propuesta: no publicamos una lista de precios porque el alcance manda. La propuesta se arma con padrón, nivel de servicio y plazo, y va por escrito. Lo que sí se puede adelantar en el primer correo es qué define el número y en qué orden de magnitud se mueve, para que no pierdas un ciclo de compra averiguándolo."
        - generic [ref=f1e142]:
          - generic [ref=f1e143]: Motivos
          - heading "Tres conversaciones que empiezan acá" [level=2] [ref=f1e145]
          - paragraph [ref=f1e147]: No hace falta tener el proyecto cerrado para escribir. Estas son las tres que más llegan.
          - generic [ref=f1e148]:
            - generic [ref=f1e150]:
              - heading "Estás armando el programa" [level=3] [ref=f1e153]
              - paragraph [ref=f1e154]: No hay nada montado más allá del curso anual. Se define qué medir primero, cómo calibrar las simulaciones y qué evidencia deja el programa.
            - generic [ref=f1e156]:
              - heading "Estás comparando proveedores" [level=3] [ref=f1e164]
              - paragraph [ref=f1e165]: "Ya tenés uno y algo no cierra: idiomas, soporte en LATAM, analítica pobre o un contrato que vence. Se compara contra lo que te falta, no contra un cuadro."
            - generic [ref=f1e167]:
              - heading "Tenés una auditoría encima" [level=3] [ref=f1e170]
              - paragraph [ref=f1e171]: Un pliego, una certificación o un requisito de cliente con fecha. Se revisa qué exige el marco y qué puede mostrar el programa en ese plazo.
