name: Browser audit
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed crawler run ID
        required: true
        type: string
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run audit:browser -- --run="$AUDIT_RUN_ID"
        env:
          AUDIT_RUN_ID: ${{ inputs.run_id }}
          DATABASE_URL: ${{ secrets.AUDIT_DATABASE_URL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-audit
          path: .audit-artifacts/browser/
          retention-days: 14
